# Töövoo sammud B ja „Paranda” (vt docs/tooprotsess.md).
# Käivitub, kui issue'le lisatakse silt `claude` (muudatuspäringu vorm teeb seda ise)
# või kui issue'sse / PR-i kirjutatakse kommentaar, mis sisaldab „@claude”.
# claude-code-action lubab käivitada ainult kasutajatel, kellel on repos kirjutusõigus.
name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  # Üks töö korraga sama issue/PR kohta, et kaks käivitust ei pushiks samasse harusse.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Paigalda Playwrighti Chromium
        run: npx playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        with:
          # Üks kahest: Claude'i GitHubi rakenduse paigaldamisel (/install-github-app) lisatakse
          # CLAUDE_CODE_OAUTH_TOKEN; API-võtme puhul ANTHROPIC_API_KEY.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          track_progress: true
          additional_permissions: |
            actions: read
          # Liitmine, productionisse avaldamine ja otse main-i pushimine on keelatud.
          # Päris kaitse on main-i harukaitse (vt docs/tooprotsess.md), see on lisakiht.
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm ci),Bash(npm run:*),Bash(npx playwright:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git switch:*),Bash(git checkout:*),Bash(git fetch:*),Bash(git pull:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh run view:*),Bash(gh run list:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh api:*),Bash(git push origin main:*),Bash(git push origin HEAD:main:*),Bash(vercel:*),Bash(npx vercel:*)"
