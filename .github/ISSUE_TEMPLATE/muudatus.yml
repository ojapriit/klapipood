name: Muudatuspäring
description: Soovi poes muudatust. Claude teeb selle eraldi harus ja avab pull requesti.
title: "Muudatus: "
labels: ["muudatus", "claude"]
body:
  - type: markdown
    attributes:
      value: |
        Silt `claude` käivitab Claude'i töövoo (`.github/workflows/claude.yml`).
        Claude teeb muudatuse skilli `poe-muudatus` järgi, avab PR-i ja kirjutab sinna ülevaate koos tõenditega.
        PR-i liidab ainult inimene.
  - type: textarea
    id: soov
    attributes:
      label: Mida muuta?
      description: Kirjelda soovi nii, nagu kirjutaksid arendajale. Mida kasutaja näeb või teeb, ja mis peab juhtuma.
      placeholder: Nt „Lisa ostukorvi vaatesse nupp, mis tühjendab kogu ostukorvi.”
    validations:
      required: true
  - type: textarea
    id: vastuvotutingimused
    attributes:
      label: Kuidas aru saada, et see on valmis? (valikuline)
      description: Kui sul on konkreetsed ootused, kirjuta need siia. Muidu koostab Claude vastuvõtutingimused ise.
  - type: textarea
    id: lisainfo
    attributes:
      label: Lisainfo (valikuline)
      description: Kuvatõmmised, viited, piirangud.
